<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/webp" href="/assets/images/Lambang-UM.webp" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Media Pembelajaran Interaktif Geografi SMA/MA Berbasis Simulasi 3D WebGL: Struktur Lapisan Bumi, Lempeng Tektonik, Vulkanisme Gunung Semeru, Tenaga Endogen, dan Kuis Evaluasi." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Dinamika Litosfer: Media Pembelajaran Interaktif Geografi" />
  <meta property="og:description" content="Eksplorasi struktur interior bumi, batas lempeng tektonik, vulkanisme Semeru, dan siklus batuan Nusantara dalam simulasi 3D WebGL interaktif." />
  <meta property="og:image" content="/assets/images/Lambang-UM.webp" />
  <meta name="theme-color" content="#5266eb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dinamika Litosfer" />
  <link rel="apple-touch-icon" href="/assets/images/Lambang-UM.webp" />
  <title>Dinamika Litosfer: Media Pembelajaran Interaktif Geografi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..600&family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-onyx-canvas: #0b0b12;
      --color-cobalt: #5266eb;
      --color-ivory-text: #f1f1f6;
      --color-ash-text: #9c9cb2;
      --color-obsidian-button: #1a1a26;
    }
    body {
      margin: 0;
      background: var(--color-onyx-canvas);
      color: var(--color-ivory-text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    #preloader {
      position: fixed;
      inset: 0;
      background: var(--color-onyx-canvas);
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease, visibility 0.5s ease;
      user-select: none;
    }
    #preloader.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .pre-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
      max-width: 440px;
    }
    .pre-logo-wrap {
      position: relative;
      width: 116px;
      height: 116px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
    }
    .pre-ring {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1.5px solid rgba(226, 227, 237, 0.18);
      border-top-color: var(--color-cobalt);
      animation: preRingSpin 3s linear infinite;
      will-change: transform;
    }
    .pre-logo {
      width: 100px;
      height: 100px;
      object-fit: contain;
      border-radius: 50%;
      animation: preLogoPulse 2.4s ease-in-out infinite;
      will-change: transform;
    }
    @keyframes preRingSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes preLogoPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    .pre-title {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-size: 28px;
      font-weight: 500;
      color: var(--color-ivory-text);
      letter-spacing: 0.015em;
      margin: 0 0 6px 0;
    }
    .pre-title span { color: var(--color-ivory-text); }
    .pre-sub {
      font-size: 13.5px;
      font-weight: 400;
      color: var(--color-ash-text);
      margin: 0 0 22px 0;
      letter-spacing: 0.01em;
    }
    .pre-progress-track {
      width: 240px;
      height: 4px;
      background: var(--color-obsidian-button);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 10px;
    }
    .pre-progress-bar {
      height: 100%;
      width: 0%;
      background: var(--color-cobalt);
      border-radius: 9999px;
      transition: width 0.18s ease;
    }
    .pre-status {
      font-size: 12px;
      font-weight: 400;
      color: var(--color-ash-text);
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>
  <!-- Preloader Resmi UM -->
  <div id="preloader">
    <div class="pre-content">
      <div class="pre-logo-wrap">
        <div class="pre-ring"></div>
        <img src="/assets/images/Lambang-UM.webp" alt="Lambang Universitas Negeri Malang" class="pre-logo" width="100" height="100" />
      </div>
      <h2 class="pre-title">Dinamika <span>Litosfer</span></h2>
      <p class="pre-sub">Media Pembelajaran Geografi · Universitas Negeri Malang</p>
      <div class="pre-progress-track">
        <div class="pre-progress-bar" id="pre-bar"></div>
      </div>
      <div class="pre-status" id="pre-status">Menyiapkan media interaktif modern...</div>
    </div>
  </div>

  <!-- ROOT APLIKASI REACT -->
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
