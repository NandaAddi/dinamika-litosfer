<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1e2a"/>
      <stop offset="100%" stop-color="#111119"/>
    </radialGradient>
    <radialGradient id="coreInner" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fff9db"/>
      <stop offset="70%" stop-color="#f59f00"/>
      <stop offset="100%" stop-color="#e67700"/>
    </radialGradient>
    <radialGradient id="coreOuter" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ff922b"/>
      <stop offset="70%" stop-color="#e03131"/>
      <stop offset="100%" stop-color="#c92a2a"/>
    </radialGradient>
    <linearGradient id="mantleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f76707"/>
      <stop offset="100%" stop-color="#d9480f"/>
    </linearGradient>
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4dabf7"/>
      <stop offset="100%" stop-color="#1864ab"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="#5266eb" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Concentric Lithosphere Spheres (Cutaway Aesthetic) -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Layer 4: Kerak & Litosfer Luar -->
    <circle r="190" fill="none" stroke="url(#crustGrad)" stroke-width="14" stroke-dasharray="1194" stroke-dashoffset="0"/>
    
    <!-- Layer 3: Astenosfer & Mantel -->
    <circle r="150" fill="none" stroke="url(#mantleGrad)" stroke-width="26" stroke-opacity="0.85"/>

    <!-- Layer 2: Inti Luar Cair -->
    <circle r="105" fill="none" stroke="url(#coreOuter)" stroke-width="32"/>

    <!-- Layer 1: Inti Dalam Padat -->
    <circle r="56" fill="url(#coreInner)"/>

    <!-- Subtle Science Crosshairs -->
    <line x1="-200" y1="0" x2="-180" y2="0" stroke="#5266eb" stroke-width="4" stroke-linecap="round"/>
    <line x1="180" y1="0" x2="200" y2="0" stroke="#5266eb" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="-200" x2="0" y2="-180" stroke="#5266eb" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="180" x2="0" y2="200" stroke="#5266eb" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
