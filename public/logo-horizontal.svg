<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 340" width="1088" height="340" fill="none">
  <style>
    #globe-body {
      transform-origin: 138px 193px;
      animation: tectonic-pulse 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    #spark-center {
      transform-origin: 137px 36px;
      animation: erupt-center 3.6s ease-out infinite;
    }

    #spark-left {
      transform-origin: 133px 51px;
      animation: erupt-left 3.6s ease-out infinite;
    }

    #spark-right {
      transform-origin: 141px 51px;
      animation: erupt-right 3.6s ease-out infinite;
    }

    #letter-o-top {
      transform-origin: 554px 157px;
      animation: o-split-top 3.6s cubic-bezier(0.45, 0, 0.25, 1) infinite;
    }

    #letter-o-bottom {
      transform-origin: 554px 216px;
      animation: o-split-bottom 3.6s cubic-bezier(0.45, 0, 0.25, 1) infinite;
    }

    /* Denyut &amp; getaran mikro tektonik pada globe */
    @keyframes tectonic-pulse {
      0%, 40%, 100% {
        transform: translate(0px, 0px) scale(1);
        filter: drop-shadow(0 0 0px rgba(255, 255, 255, 0));
      }
      44% {
        transform: translate(-1.5px, 0.5px) scale(0.992);
      }
      48% {
        transform: translate(1.5px, -0.5px) scale(0.992);
      }
      52% {
        transform: translate(-1px, 1px) scale(0.988);
      }
      66% {
        transform: translate(0px, -4px) scale(1.022);
        filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.45));
      }
      85% {
        transform: translate(0px, 0px) scale(1);
        filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.1));
      }
    }

    /* Percikan tengah */
    @keyframes erupt-center {
      0% {
        transform: translate(0px, 0px) scale(1);
        opacity: 1;
      }
      32% {
        transform: translate(0px, -16px) scale(0.72);
        opacity: 0;
      }
      33%, 54% {
        transform: translate(0px, 14px) scale(0.25);
        opacity: 0;
      }
      78% {
        transform: translate(0px, 3px) scale(1.06);
        opacity: 1;
      }
      100% {
        transform: translate(0px, 0px) scale(1);
        opacity: 1;
      }
    }

    /* Percikan kiri */
    @keyframes erupt-left {
      0% {
        transform: translate(0px, 0px) scale(1);
        opacity: 1;
      }
      38% {
        transform: translate(-10px, -12px) scale(0.7);
        opacity: 0;
      }
      39%, 60% {
        transform: translate(8px, 10px) scale(0.25);
        opacity: 0;
      }
      84% {
        transform: translate(2px, 3px) scale(1.06);
        opacity: 1;
      }
      100% {
        transform: translate(0px, 0px) scale(1);
        opacity: 1;
      }
    }

    /* Percikan kanan */
    @keyframes erupt-right {
      0% {
        transform: translate(0px, 0px) scale(1);
        opacity: 1;
      }
      42% {
        transform: translate(10px, -12px) scale(0.7);
        opacity: 0;
      }
      43%, 64% {
        transform: translate(-8px, 10px) scale(0.25);
        opacity: 0;
      }
      88% {
        transform: translate(-2px, 3px) scale(1.06);
        opacity: 1;
      }
      100% {
        transform: translate(0px, 0px) scale(1);
        opacity: 1;
      }
    }

    /* Belahan atas huruf O */
    @keyframes o-split-top {
      0%, 50%, 96%, 100% {
        transform: translate(0px, 0px);
      }
      68% {
        transform: translate(2px, -4.5px);
      }
    }

    /* Belahan bawah huruf O */
    @keyframes o-split-bottom {
      0%, 50%, 96%, 100% {
        transform: translate(0px, 0px);
      }
      68% {
        transform: translate(-2px, 4.5px);
      }
    }

    /* Hormati pengaturan aksesibilitas browser */
    @media (prefers-reduced-motion: reduce) {
      #globe-body,
      #spark-center,
      #spark-left,
      #spark-right,
      #letter-o-top,
      #letter-o-bottom {
        animation: none;
      }
    }
  </style>

